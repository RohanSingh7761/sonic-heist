<!doctype html><meta charset="utf-8"><title>Sonic Heist Sounds</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#fff4e4;color:#4a3a2c;font:600 14px/1.4 ui-monospace,Menlo,monospace;padding:24px 16px}
h1{color:#e5484d;letter-spacing:.12em;margin:0 0 4px}h2{margin:32px 0 10px;text-transform:uppercase;letter-spacing:.1em;border-bottom:4px solid #e5484d;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;background:#fffaf1;border:3px solid #2a2230;padding:8px;box-shadow:0 4px 0 #2a2230}
button:focus-visible{outline:3px solid #2fb3ad;outline-offset:2px}
button:active,button[aria-pressed=true]{transform:translateY(4px);box-shadow:none;background:#ffe6b8}
img{width:72px;height:72px;flex:none}b{display:block;color:#2a2230}small{color:#7a6a58;font-weight:500}.loop{color:#2f8f88}
</style>
<h1>SONIC HEIST</h1><div>28 chiptune sounds. Tap to play. Tap a loop again to stop it.</div>
<h2>Money</h2><div class="grid"><button data-name="coin" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/saved.svg" alt=""><span><b>coin</b><small>One coin picked up</small></span></button><button data-name="coin-drop" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/caught.svg" alt=""><span><b>coin-drop</b><small>Coins bouncing on the floor</small></span></button><button data-name="loot-grab" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/sneak.svg" alt=""><span><b>loot-grab</b><small>Thief scoops the victim's stake</small></span></button><button data-name="deposit" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/idle.svg" alt=""><span><b>deposit</b><small>ETH going into the vault</small></span></button><button data-name="jackpot" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/swag.svg" alt=""><span><b>jackpot</b><small>Big payout: loot claimed</small></span></button><button data-name="stake-lost" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/cry.svg" alt=""><span><b>stake-lost</b><small>Your stake is gone</small></span></button></div><h2>Running</h2><div class="grid"><button data-name="footsteps-loop" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/run.svg" alt=""><span><b>footsteps-loop <span class="loop">↻</span></b><small>Feet only. Matches the run sprite cycle</small></span></button><button data-name="run-loop" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/run.svg" alt=""><span><b>run-loop <span class="loop">↻</span></b><small>Chase theme for the group run</small></span></button><button data-name="sneak-loop" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/sneak.svg" alt=""><span><b>sneak-loop <span class="loop">↻</span></b><small>Tiptoe pluck. Matches the sneak sprite cycle</small></span></button><button data-name="dash" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/thief-run.svg" alt=""><span><b>dash</b><small>Whoosh as the thief takes off</small></span></button><button data-name="heist-start" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/thief.svg" alt=""><span><b>heist-start</b><small>Sting when the loot lands on-chain</small></span></button></div><h2>Crying</h2><div class="grid"><button data-name="cry" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/cry.svg" alt=""><span><b>cry <span class="loop">↻</span></b><small>Three wails and hiccups. Matches the cry sprite cycle</small></span></button><button data-name="tear" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/cry.svg" alt=""><span><b>tear</b><small>A single tear plip</small></span></button></div><h2>Swag</h2><div class="grid"><button data-name="swag" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/swag.svg" alt=""><span><b>swag <span class="loop">↻</span></b><small>Shades whistle down, thunk, then the groove. Matches the swag sprite cycle</small></span></button><button data-name="bling" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/swag.svg" alt=""><span><b>bling</b><small>Sparkle off the glasses or chain</small></span></button></div><h2>Alert</h2><div class="grid"><button data-name="alert" data-loop="true" aria-pressed="false"><img src="../sprites/rocco/lv2/alert.svg" alt=""><span><b>alert <span class="loop">↻</span></b><small>Two-tone siren: you have been robbed. Matches the alert sprite cycle</small></span></button><button data-name="bang" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/alert.svg" alt=""><span><b>bang</b><small>The red "!" popping up</small></span></button><button data-name="robbed" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/alert.svg" alt=""><span><b>robbed</b><small>Reveal sting before the hunt starts</small></span></button><button data-name="tick" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/hunt.svg" alt=""><span><b>tick</b><small>Countdown tick</small></span></button><button data-name="tick-urgent" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/hunt.svg" alt=""><span><b>tick-urgent</b><small>Countdown tick for the final seconds</small></span></button><button data-name="radar-ping" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/hunt.svg" alt=""><span><b>radar-ping</b><small>Sonar blip with two echoes</small></span></button><button data-name="thief-near" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/hunt.svg" alt=""><span><b>thief-near</b><small>Thief in range: hot signal</small></span></button></div><h2>Outcomes</h2><div class="grid"><button data-name="caught" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/caught.svg" alt=""><span><b>caught</b><small>Thief busted: bonk, then the fall</small></span></button><button data-name="saved" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/saved.svg" alt=""><span><b>saved</b><small>Victim got it all back, plus the bond</small></span></button><button data-name="level-up" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/idle.svg" alt=""><span><b>level-up</b><small>Avatar reached a new level</small></span></button><button data-name="ui-click" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/idle.svg" alt=""><span><b>ui-click</b><small>Button press</small></span></button><button data-name="ui-deny" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/locked.svg" alt=""><span><b>ui-deny</b><small>Not allowed: cooldown, immune, locked</small></span></button><button data-name="shield-on" data-loop="false" aria-pressed="false"><img src="../sprites/rocco/lv2/idle.svg" alt=""><span><b>shield-on</b><small>Shield mode turned on</small></span></button></div>
<script>
const players = {};
document.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.name;
    const a = (players[name] ??= new Audio(name + '.wav'));
    if (btn.dataset.loop === 'true') {
      const on = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', on);
      a.loop = on;
      if (!on) { a.pause(); a.currentTime = 0; return; }
    } else a.currentTime = 0;
    a.play();
  });
});
</script>
